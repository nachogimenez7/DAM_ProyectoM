<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payador — Contrapunto</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090706;
    }
    body {
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
    }
    .phone {
      position: relative;
      width: 432px;
      height: 900px;
      overflow: hidden;
      background:
        linear-gradient(rgba(7, 5, 4, .48), rgba(7, 5, 4, .63)),
        url("../../../../app/src/main/res/drawable/mapa_pampa_vertical_noche.webp") center/cover;
    }
    .game-ui {
      position: absolute;
      inset: 0;
      opacity: .32;
      color: #d7b165;
      padding: 22px 18px;
    }
    .game-ui .top {
      display: flex;
      justify-content: space-between;
      font: 700 18px Arial, sans-serif;
    }
    .game-ui .chat {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 64px;
      height: 210px;
      border: 1px solid #73551f;
      border-radius: 14px;
      background: rgba(13, 9, 6, .75);
    }
    .shade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(26, 17, 10, .44), rgba(0, 0, 0, .88)),
        rgba(0, 0, 0, .54);
      backdrop-filter: blur(2px);
    }
    .modal {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      padding: 14px;
      border: 2px solid #b9822a;
      border-radius: 20px;
      background:
        linear-gradient(145deg, rgba(53, 31, 16, .97), rgba(16, 10, 7, .99) 44%, rgba(38, 21, 12, .98));
      box-shadow:
        0 0 0 2px #3a2412,
        0 0 0 4px #866026,
        0 20px 55px rgba(0, 0, 0, .86),
        inset 0 0 38px rgba(211, 143, 36, .08);
      color: #f6e5bd;
    }
    .ornament {
      height: 12px;
      margin: -2px 28px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cc963a;
    }
    .ornament::before, .ornament::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, #c18b33);
    }
    .ornament::after { transform: scaleX(-1); }
    .ornament span { font-size: 13px; }
    h1 {
      margin: 0 0 5px;
      text-align: center;
      color: #f0bd54;
      font-size: 25px;
      line-height: 1.05;
      letter-spacing: .5px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #4a2507, 0 0 12px rgba(225, 159, 50, .25);
    }
    .kicker {
      margin: 0 0 12px;
      text-align: center;
      color: #cdbb95;
      font: 600 13px Arial, sans-serif;
      letter-spacing: .4px;
    }
    .art {
      position: relative;
      overflow: hidden;
      height: 258px;
      border: 1px solid #8e6428;
      border-radius: 13px;
      background: #100b08;
      box-shadow: inset 0 0 30px #000;
    }
    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 -42px 32px rgba(8, 5, 3, .72), inset 0 0 22px rgba(0, 0, 0, .6);
    }
    .players {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 9px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 86px;
    }
    .player {
      min-width: 105px;
      padding: 7px 10px 6px;
      border: 1px solid #d59b36;
      border-radius: 9px;
      background: rgba(24, 13, 8, .9);
      box-shadow: 0 3px 12px #000;
      text-align: center;
    }
    .player strong {
      display: block;
      color: #f4cf7e;
      font: 800 14px Arial, sans-serif;
      letter-spacing: .5px;
    }
    .player span {
      display: block;
      margin-top: 2px;
      color: #a99879;
      font: 700 9px Arial, sans-serif;
      letter-spacing: 1.2px;
    }
    .rule {
      margin: 13px 8px 4px;
      text-align: center;
      font: 700 15px/1.35 Arial, sans-serif;
      color: #f0e3ca;
    }
    .consequence {
      margin: 0 14px 14px;
      text-align: center;
      font: 12px/1.35 Arial, sans-serif;
      color: #aa997c;
    }
    .button {
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid #f0bd50;
      border-radius: 12px;
      background: linear-gradient(#efc455, #b57917);
      box-shadow: inset 0 1px #fff1a8, 0 5px 15px rgba(0, 0, 0, .5);
      color: #211307;
      font: 900 15px Arial, sans-serif;
      letter-spacing: .7px;
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="game-ui">
      <div class="top"><span>DÍA · DEBATE</span><span>01:24</span></div>
      <div class="chat"></div>
    </section>
    <div class="shade"></div>
    <section class="modal" aria-label="Anuncio del Contrapunto">
      <div class="ornament"><span>◆</span></div>
      <h1>¡Comienza el contrapunto!</h1>
      <p class="kicker">El Payador ha elegido a dos voces</p>
      <div class="art">
        <img src="payador-contrapunto-concept.png" alt="">
        <div class="players">
          <div class="player"><strong>LAUTARO</strong><span>PRIMERA VOZ</span></div>
          <div class="player"><strong>JULI</strong><span>SEGUNDA VOZ</span></div>
        </div>
      </div>
      <p class="rule">Solo ellos podrán hablar durante el contrapunto.</p>
      <p class="consequence">Al terminar, uno de los dos quedará señalado.</p>
      <div class="button">COMENZAR</div>
    </section>
  </main>
</body>
</html>
