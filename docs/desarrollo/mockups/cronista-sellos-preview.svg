      .label { font: 700 19px Arial, sans-serif; fill: #f2d27d; letter-spacing: 1px; }
      .desc { font: 400 15px Arial, sans-serif; fill: #aa9b88; }
      .symbol { fill: none; stroke: #ffe5a0; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .symbol-fill { fill: #ffe5a0; stroke: #4e2b13; stroke-width: 2; stroke-linejoin: round; }
