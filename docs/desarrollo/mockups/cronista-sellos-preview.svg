<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d0a"/>
      <stop offset="0.55" stop-color="#21170f"/>
      <stop offset="1" stop-color="#0b0907"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a9"/>
      <stop offset="0.22" stop-color="#d9a93d"/>
      <stop offset="0.55" stop-color="#6f4214"/>
      <stop offset="0.78" stop-color="#efc967"/>
      <stop offset="1" stop-color="#8a541a"/>
